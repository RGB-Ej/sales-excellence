<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: sticky header with owner switch, one working view, nav at bottom on phone / top on desktop */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#e8ede7; --line:#d4dcd3;
  --fg:#15201a; --muted:#5a685e; --accent:#1d6a49; --accent-ink:#ffffff; --accent-soft:#d9eadf;
  --signal:#b86e12; --signal-soft:#f6e7d2; --good:#2c8a4c; --warn:#a96d10; --bad:#b33b2b; --bad-soft:#f7dfda;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#151d18; --surface-2:#1c2620; --line:#29352d;
  --fg:#e3eae4; --muted:#91a096; --accent:#5ec08d; --accent-ink:#08130d; --accent-soft:#1d3729;
  --signal:#e2a24c; --signal-soft:#3a2a14; --good:#5ec08d; --warn:#e0b252; --bad:#f07a65; --bad-soft:#3d1f1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#151d18; --surface-2:#1c2620; --line:#29352d;
  --fg:#e3eae4; --muted:#91a096; --accent:#5ec08d; --accent-ink:#08130d; --accent-soft:#1d3729;
  --signal:#e2a24c; --signal-soft:#3a2a14; --good:#5ec08d; --warn:#e0b252; --bad:#f07a65; --bad-soft:#3d1f1a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.no-claude [data-act="callai"],.no-claude #voiceLang,.no-claude [data-act="ai"],.no-claude [data-act="import"][data-v="apollo"],.no-claude [data-act="imptab"][data-v="apollo"]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px;white-space:nowrap}
.sync{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:4px;vertical-align:1px}
.sync.on{background:var(--good)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
select.mini{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600}

nav.tabs{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding-top:10px}
nav.tabs button{border:0;background:transparent;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
h1{font-family:var(--f-display);font-size:28px;line-height:1.1;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-family:var(--f-display);font-size:17px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.card-h .count{color:var(--muted);font-size:13px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:600;letter-spacing:-.02em}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .d{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.sig i{background:var(--signal)}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row{flex-wrap:wrap;row-gap:6px}
.row .main{flex:1 1 170px;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row.click{cursor:pointer}
.row.click:hover .t{color:var(--accent)}
.done .t{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.empty b{color:var(--fg)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.sig{background:var(--signal-soft);color:var(--signal)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.own{background:transparent;border:1px solid var(--line)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
a.btn{text-decoration:none;color:inherit}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.chk{width:20px;height:20px;accent-color:var(--accent);flex:none}

/* pipeline board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{flex:0 0 250px;scroll-snap-align:start;background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.closed{flex-basis:200px;opacity:.85}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 2px 4px}
.col-h b{font-size:13.5px}
.col-h span{font-size:12px;color:var(--muted)}
.stage-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.dcard:hover{border-color:var(--accent)}
.dcard .t{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.dcard .m{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.dcard .f{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:2px}
.adv{border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;font-size:12px;font-weight:700;padding:3px 8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}

.hbars{display:flex;flex-direction:column;gap:9px}
.hb{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.hb .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb .track i{display:block;height:100%;border-radius:4px}
.hb .lab{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* week plan */
.weeknav{display:flex;align-items:center;gap:6px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day.weekend{background:var(--surface-2)}
.day-h{display:flex;justify-content:space-between;align-items:baseline}
.day-h b{font-family:var(--f-display);font-size:16px}
.item{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:5px 0;min-width:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .m{font-size:12.5px;color:var(--muted)}
.item.click{cursor:pointer}
.tag{flex:none;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--muted);margin-top:2px}
.tag.fu{background:var(--signal-soft);color:var(--signal)}
.tag.dl{background:var(--accent-soft);color:var(--accent)}

/* calls */
.qlog{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.outcomes{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.outcomes label{position:relative}
.outcomes input{position:absolute;opacity:0;pointer-events:none}
.outcomes span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface)}
.outcomes input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.outcomes input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.search{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.field.full{grid-column:1/-1}
.field.check{flex-direction:row;align-items:center;gap:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}

.scrim{position:fixed;inset:0;background:rgba(8,14,10,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.panel{background:var(--surface);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.panel{border-radius:14px}}
.panel-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.panel-f{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.panel-f .left{margin-right:auto}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-grid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:16px 12px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:3px}
.menu-grid button small{font-weight:500;color:var(--muted);font-size:12.5px}
.menu-grid button:hover{border-color:var(--accent)}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;width:56px;height:56px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.22);display:grid;place-items:center}
.fab svg{width:26px;height:26px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}

.qgrid{display:flex;flex-direction:column;gap:6px}
.qrow{display:grid;grid-template-columns:20px 130px 1fr;gap:8px;align-items:center}
.qrow label{font-weight:600;font-size:13.5px}
.qrow input[type=text],.qrow input:not([type]){border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;min-width:0;font-size:13.5px}
@media (max-width:520px){.qrow{grid-template-columns:20px 1fr}.qrow input:not([type]){grid-column:1/-1}}
.ai-out{white-space:pre-wrap;font-size:14.5px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:120px;overflow-wrap:anywhere}
.ai-out.wait{color:var(--muted)}
.tl{display:flex;flex-direction:column}
.tl .ev{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tl .ev:first-child{border-top:0}
.tl .when{font-size:12.5px;color:var(--muted);font-family:var(--f-num)}
.tl .what{min-width:0;overflow-wrap:anywhere}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0;margin-bottom:6px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sdrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:8px 0 10px}
.stat2 div{display:flex;flex-direction:column}
.stat2 .v{font-family:var(--f-num);font-weight:600;font-size:18px}
.stat2 .l{font-size:12px;color:var(--muted)}

@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);margin:0;max-width:none;
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around;gap:0}
  nav.tabs button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 4px;flex:1;min-width:0}
  nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .fab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  main{padding-bottom:160px}
  h1{font-size:24px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:no-preference){.dcard,.btn,.row .t{transition:border-color .15s,color .15s}}
</style>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const pd=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const weekStartOf=s=>{const d=pd(s);d.setDate(d.getDate()-d.getDay());return iso(d)}; // Sunday start (Sun–Thu work week)
const fmtD=s=>s?pd(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}):'—';

  const obj=readForm(form,coll,{...cur.obj});
  if(coll==='deals'){
    if(obj.stage==='Lost'&&(!obj.lossReason||obj.lossReason==='—')){toast('Pick a loss reason before marking the deal Lost');form.elements.lossReason.focus();return}
    obj.qual={};MEDDICC.forEach(([k])=>{obj.qual[k]={ok:form.elements['q_ok_'+k].checked,note:form.elements['q_note_'+k].value.trim()}});
  }
  if(obj.sdr==='Me')obj.sdr='—';
  if(!obj.id){obj.id=uid();obj.createdAt=today()}

  if(coll==='deals'&&(!orig||orig.stage!==obj.stage))obj.stageHistory=[...((orig&&orig.stageHistory)||[]),{stage:obj.stage,at:today()}];

  let c=state.contacts.find(c=>(c.company||'').trim().toLowerCase()===co&&(!nm||(c.name||'').trim().toLowerCase()===nm));

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- derived ---------- */
const openDeals=()=>S('deals').filter(d=>OPEN.includes(d.stage));
const weekStart=()=>addDays(weekStartOf(today()),7*ui.weekOffset);
const inWeek=(s,ws)=>s&&s>=ws&&s<=addDays(ws,6);
function quarter(){const d=new Date();const qs=new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1);const qe=new Date(qs.getFullYear(),qs.getMonth()+3,0);return {s:iso(qs),e:iso(qe),n:'Q'+(Math.floor(d.getMonth()/3)+1)}}
const dueFollowUps=(upto)=>S('contacts').filter(c=>c.nextFollowUp&&c.nextFollowUp<=upto&&!['Not interested','Customer'].includes(c.status)).sort((a,b)=>a.nextFollowUp.localeCompare(b.nextFollowUp));

/* ---------- icons & tabs ---------- */

 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

 calls:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
 contacts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',

};
const TABS=[['today','Today'],['pipeline','Pipeline'],['plan','Week plan'],['calls','Calls'],['contacts','Contacts'],['team','SDR team']];

/* ---------- views ---------- */
function vToday(){
  const t=today(), ws=weekStartOf(t);
  const od=openDeals(), acts=S('activities');
  const wkCalls=acts.filter(a=>isCall(a)&&inWeek(a.date,ws)).length;
  const wkMeet=acts.filter(a=>a.outcome==='Meeting booked'&&inWeek(a.date,ws)).length;
  const ct=callTarget(), mt=meetTarget();
  const fus=dueFollowUps(t);
  const tasks=S('tasks').filter(x=>!x.done&&x.date&&x.date<=t).sort((a,b)=>(a.priority==='High'?0:1)-(b.priority==='High'?0:1)||a.date.localeCompare(b.date));
  const doneToday=S('tasks').filter(x=>x.done&&x.date===t);
  const steps=od.filter(d=>d.nextStepDate&&d.nextStepDate<=addDays(t,1)).sort((a,b)=>a.nextStepDate.localeCompare(b.nextStepDate));
  const callsToday=acts.filter(a=>isCall(a)&&a.date===t).length;
  const lb=lastBackup(), nudge=mode==='local'&&(state.contacts.length+state.deals.length)>0&&(!lb||daysBetween(lb,t)>=7);
  return `${nudge?`<div class="card" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-color:var(--signal)"><div style="flex:1;min-width:200px"><b>Back up your data</b><div class="m" style="color:var(--muted);font-size:13px">${lb?`Last backup ${fmtS(lb)}.`:'No backup yet.'} Data on this device is not copied anywhere else.</div></div><button class="btn pri" data-act="backup">Download backup</button></div>`:''}<div class="head"><div><h1>${fmtD(t)}</h1><p class="sub">${esc(scopeLabel())} · ${callsToday} call${callsToday===1?'':'s'} logged today</p></div></div>
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">Open pipeline</span><span class="v">${money(sum(od,d=>usd(d)))}</span><span class="d">${od.length} open deal${od.length===1?'':'s'}</span></div>
    <div class="kpi"><span class="eyebrow">Weighted</span><span class="v">${money(sum(od,d=>usd(d)*prob(d.stage)/100))}</span><span class="d">By stage probability</span></div>
    <div class="kpi"><span class="eyebrow">Calls this week</span><span class="v">${wkCalls}<small> / ${ct}</small></span><div class="bar"><i style="width:${pct(wkCalls,ct)}%"></i></div></div>
    <div class="kpi"><span class="eyebrow">Meetings booked</span><span class="v">${wkMeet}<small> / ${mt}</small></span><div class="bar sig"><i style="width:${pct(wkMeet,mt)}%"></i></div></div>
  </div>
  <div class="cols">
    <section class="card"><div class="card-h"><h2>Follow-ups due</h2><span class="count">${fus.length}</span></div><div class="list">
      ${fus.length?fus.map(c=>{const late=daysBetween(c.nextFollowUp,t);return `<div class="row"><div class="main click" data-act="edit" data-coll="contacts" data-id="${c.id}" role="button" tabindex="0"><div class="t">${esc(c.name)}</div><div class="m">${esc([c.role,c.company].filter(Boolean).join(' · '))}${c.phone?' · '+esc(c.phone):''}</div></div>${ownerChip(c)}<span class="pill ${late>0?'bad':'sig'}">${late>0?late+'d late':'Today'}</span><button type="button" class="btn sm" data-act="reach" data-v="" data-id="${c.id}" aria-label="Reach ${esc(c.name)}">✦ Reach</button><button class="btn sm" data-act="logfor" data-id="${c.id}">Log</button></div>`}).join(''):'<div class="empty">No follow-ups due. Log a call with a follow-up date and it shows up here.</div>'}
    </div></section>
    <section class="card"><div class="card-h"><h2>Tasks</h2><span class="count">${doneToday.length} done today</span></div><div class="list">
      ${tasks.length?tasks.map(taskRow).join(''):'<div class="empty">Nothing open for today. Add tasks in the week plan.</div>'}
    </div></section>
    <section class="card"><div class="card-h"><h2>Deal next steps</h2><span class="count">${steps.length}</span></div><div class="list">
      ${steps.length?steps.map(d=>`<div class="row click" data-act="edit" data-coll="deals" data-id="${d.id}"><div class="main"><div class="t">${esc(d.nextStep||'Next step')}</div><div class="m">${esc(d.name)} · ${esc(d.company)}</div></div>${ownerChip(d)}<span class="pill ${d.nextStepDate<t?'bad':'acc'}">${d.nextStepDate<t?'Overdue':fmtS(d.nextStepDate)}</span></div>`).join(''):'<div class="empty">No deal next steps due. Set a next step date on each deal to keep it moving.</div>'}
    </div></section>
  </div>`;
}
function taskRow(x){
  const t=today();
  return `<div class="row ${x.done?'done':''}"><input type="checkbox" class="chk" data-toggle="${x.id}" ${x.done?'checked':''} aria-label="Mark done"><div class="main click" data-act="edit" data-coll="tasks" data-id="${x.id}"><div class="t">${esc(x.title)}</div><div class="m">${esc([x.type,x.company].filter(Boolean).join(' · '))}</div></div>${ownerChip(x)}${x.priority==='High'?'<span class="pill sig">High</span>':''}${!x.done&&x.date<t?`<span class="pill bad">${fmtS(x.date)}</span>`:''}</div>`;
}

function vPipeline(){
  const all=S('deals').filter(d=>ui.country==='All'||d.country===ui.country);
  const countries=['All',...COUNTRIES];
  const head=`<div class="head"><div><h1>Pipeline</h1><p class="sub">${esc(scopeLabel())} · ${all.filter(d=>OPEN.includes(d.stage)).length} open · ${money(sum(all.filter(d=>OPEN.includes(d.stage)),d=>usd(d)))}</p></div>
   <div class="toolbar"><div class="seg">${[['board','Board'],['table','Table'],['review','Review'],['weekly','Weekly report'],['insights','Insights']].map(([k,l])=>`<button data-act="pv" data-v="${k}" aria-pressed="${ui.pipeView===k}">${l}</button>`).join('')}</div>
   <select class="mini" id="countryPick" aria-label="Country">${countries.map(c=>`<option ${c===ui.country?'selected':''}>${c}</option>`).join('')}</select></div></div>`;
  if(!S('deals').length)return head+`<div class="card empty"><b>No deals yet.</b> Tap + and choose Deal to add your first opportunity.</div>`;
  if(ui.pipeView==='table')return head+pipeTable(all);
  if(ui.pipeView==='review')return head+pipeReview(all);
  if(ui.pipeView==='insights')return head+vInsights(all);
  if(ui.pipeView==='weekly')return head+vWeekly();
  return head+`<div class="board">${SN.map(s=>{const ds=all.filter(d=>d.stage===s).sort((a,b)=>(a.closeDate||'9').localeCompare(b.closeDate||'9'));return `<div class="col ${s==='Won'||s==='Lost'?'closed':''}"><div class="col-h"><b><span class="stage-dot" style="background:${stageColor(s)}"></span>${s}</b><span class="num">${ds.length} · ${money(sum(ds,d=>usd(d)))}</span></div>
   ${ds.map(d=>`<div class="dcard" data-act="edit" data-coll="deals" data-id="${d.id}" role="button" tabindex="0"><div class="t">${esc(d.name)}</div><div class="m">${esc(d.company)}${d.country?' · '+esc(d.country):''}</div>${d.nextStep?`<div class="m">→ ${esc(d.nextStep)}${d.nextStepDate?' · '+fmtS(d.nextStepDate):''}</div>`:''}<div class="f"><span class="num" title="${d.currency&&d.currency!=='USD'?esc(d.currency+' '+d.value):''}">${d.value?money(usd(d)):'<span class="pill">No value</span>'}</span>${OPEN.includes(d.stage)?`<span class="pill ${qScore(d)>=5?'acc':qScore(d)>=3?'':'sig'} num" title="MEDDICC">Q${qScore(d)}</span>`:''}${ownerChip(d)}<span class="m">${d.closeDate?fmtS(d.closeDate):''}</span>${OPEN.includes(d.stage)?`<button class="adv" data-act="adv" data-id="${d.id}" aria-label="Move to next stage">${SN[SN.indexOf(d.stage)+1]} ›</button>`:''}</div></div>`).join('')}</div>`}).join('')}</div>`;
}
function pipeTable(all){
  const rows=[...all].sort((a,b)=>SN.indexOf(a.stage)-SN.indexOf(b.stage)||(a.closeDate||'9').localeCompare(b.closeDate||'9'));
  return `<div class="tablewrap"><table><thead><tr><th>Opportunity</th><th>Company</th><th>Stage</th><th class="r">Value</th><th class="r">Weighted</th><th>Forecast</th><th class="r">MEDDICC</th><th>Close</th><th>Next step</th><th>Owner</th></tr></thead><tbody>
  ${rows.map(d=>`<tr data-act="edit" data-coll="deals" data-id="${d.id}"><td><b>${esc(d.name)}</b></td><td>${esc(d.company)}</td><td><span class="stage-dot" style="background:${stageColor(d.stage)}"></span>${esc(d.stage)}</td><td class="r num">${d.value?money(usd(d)):'—'}</td><td class="r num">${d.value?money(usd(d)*prob(d.stage)/100):'—'}</td><td>${esc(d.forecast||'')}</td><td class="r num">${qScore(d)}/7</td><td class="num">${fmtS(d.closeDate)}</td><td>${esc(d.nextStep||'')}${d.nextStepDate?` <span class="m">(${fmtS(d.nextStepDate)})</span>`:''}</td><td>${esc(d.owner||'Me')}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function reviewData(all){
  const t=today(), q=quarter(), od=all.filter(d=>OPEN.includes(d.stage));
  const inQ=d=>d.closeDate&&d.closeDate>=q.s&&d.closeDate<=q.e;
  const commit=sum(od.filter(d=>inQ(d)&&d.forecast==='Commit'),d=>usd(d));
  const best=commit+sum(od.filter(d=>inQ(d)&&d.forecast==='Best case'),d=>usd(d));
  const won=sum(all.filter(d=>d.stage==='Won'&&(d.stageHistory||[]).some(h=>h.stage==='Won'&&h.at>=q.s&&h.at<=q.e)),d=>usd(d));
  const month=t.slice(0,7);
  const closing=od.filter(d=>d.closeDate&&d.closeDate.slice(0,7)<=month).sort((a,b)=>a.closeDate.localeCompare(b.closeDate));
  const wk=addDays(t,-7);
  const moved=[];all.forEach(d=>(d.stageHistory||[]).forEach((h,i)=>{if(i>0&&h.at>=wk)moved.push({d,from:d.stageHistory[i-1].stage,to:h.stage,at:h.at})}));
  const issues=[];od.forEach(d=>{const p=[];if(d.closeDate&&d.closeDate<t)p.push('close date passed');if(!d.value)p.push('no value');if(!d.closeDate)p.push('no close date');if(!d.nextStep)p.push('no next step');if(d.forecast==='Commit'&&qScore(d)<5)p.push(`in Commit with MEDDICC ${qScore(d)}/7`);const age=d.updatedAt?daysBetween(d.updatedAt,t):0;if(age>=14)p.push(`no update in ${age} days`);if(p.length)issues.push({d,p})});
  return {q,od,commit,best,won,closing,moved,issues};
}
function pipeReview(all){
  const r=reviewData(all), tgt=+state.settings.quarterTarget||0;
  const byStage=OPEN.map(s=>({s,ds:r.od.filter(d=>d.stage===s)}));
  const max=Math.max(1,...byStage.map(x=>sum(x.ds,d=>usd(d))));
  return `<div class="kpis">
    <div class="kpi"><span class="eyebrow">${r.q.n} commit</span><span class="v">${money(r.commit)}</span><span class="d">Forecast = Commit, closing this quarter</span></div>
    <div class="kpi"><span class="eyebrow">${r.q.n} best case</span><span class="v">${money(r.best)}</span><span class="d">Commit + best case</span></div>
    <div class="kpi"><span class="eyebrow">Won in ${r.q.n}</span><span class="v">${money(r.won)}${tgt?`<small> / ${money(tgt)}</small>`:''}</span>${tgt?`<div class="bar"><i style="width:${pct(r.won,tgt)}%"></i></div>`:'<span class="d">Set a quarter target in settings</span>'}</div>
    <div class="kpi"><span class="eyebrow">Weighted pipeline</span><span class="v">${money(sum(r.od,d=>usd(d)*prob(d.stage)/100))}</span><span class="d">${r.od.length} open deals</span></div>
  </div>
  <div class="cols">
   <section class="card"><div class="card-h"><h2>Pipeline by stage</h2><div class="toolbar"><button class="btn sm" data-act="copyreview">Copy summary</button><button class="btn sm" data-act="ai" data-v="review">✦ Write for manager</button></div></div><div class="hbars">
    ${byStage.map(x=>{const v=sum(x.ds,d=>usd(d));return `<div class="hb"><span class="lab">${x.s} <span class="num">(${x.ds.length})</span></span><div class="track"><i style="width:${Math.max(v?2:0,v/max*100)}%;background:${stageColor(x.s)}"></i></div><span class="num">${money(v)}</span></div>`}).join('')}
   </div></section>
   ${sdrs().length?(()=>{const g=['Me',...sdrs()].map(n=>({n,ds:r.od.filter(d=>n==='Me'?!sdrOf(d):sdrOf(d)===n)}));const mx=Math.max(1,...g.map(x=>sum(x.ds,d=>usd(d))));return `<section class="card"><div class="card-h"><h2>Pipeline by owner</h2><span class="count">Open deals</span></div><div class="hbars">${g.map(x=>{const v=sum(x.ds,d=>usd(d));return `<div class="hb"><span class="lab">${esc(x.n)} <span class="num">(${x.ds.length})</span></span><div class="track"><i style="width:${Math.max(v?2:0,v/mx*100)}%;background:${x.n==='Me'?'color-mix(in oklab, var(--muted) 55%, transparent)':'var(--signal)'}"></i></div><span class="num">${money(v)}</span></div>`}).join('')}</div><p class="sub" style="font-size:12.5px">Me = deals you own yourself.</p></section>`})():''}
   <section class="card"><div class="card-h"><h2>Closing this month</h2><span class="count">${r.closing.length}</span></div><div class="list">
    ${r.closing.length?r.closing.map(d=>`<div class="row click" data-act="edit" data-coll="deals" data-id="${d.id}"><div class="main"><div class="t">${esc(d.name)}</div><div class="m">${esc(d.company)} · ${esc(d.stage)} · ${esc(d.forecast||'Pipeline')}</div></div>${ownerChip(d)}<span class="num">${money(usd(d))}</span><span class="pill ${d.closeDate<today()?'bad':'acc'}">${fmtS(d.closeDate)}</span></div>`).join(''):'<div class="empty">No deals expected to close this month.</div>'}
   </div></section>
   <section class="card"><div class="card-h"><h2>Moved in the last 7 days</h2><span class="count">${r.moved.length}</span></div><div class="list">
    ${r.moved.length?r.moved.map(m=>`<div class="row click" data-act="edit" data-coll="deals" data-id="${m.d.id}"><div class="main"><div class="t">${esc(m.d.name)}</div><div class="m">${esc(m.from)} → <b style="color:${m.to==='Lost'?'var(--bad)':'var(--accent)'}">${esc(m.to)}</b> · ${fmtS(m.at)}</div></div>${ownerChip(m.d)}</div>`).join(''):'<div class="empty">No stage changes this week.</div>'}
   </div></section>
   <section class="card"><div class="card-h"><h2>Needs attention</h2><span class="count">${r.issues.length}</span></div><div class="list">
    ${r.issues.length?r.issues.map(x=>`<div class="row click" data-act="edit" data-coll="deals" data-id="${x.d.id}"><div class="main"><div class="t">${esc(x.d.name)}</div><div class="m">${esc(x.d.company)} · ${esc(x.p.join(', '))}</div></div>${ownerChip(x.d)}</div>`).join(''):'<div class="empty">Every open deal has a value, close date and next step.</div>'}
   </div></section>
  </div>`;
}
function reviewText(){
  const all=S('deals'), r=reviewData(all), tgt=+state.settings.quarterTarget||0;
  const L=[`Pipeline review · ${fmtD(today())} · ${scopeLabel()}`,'',
   `Open pipeline: ${money(sum(r.od,d=>usd(d)))} across ${r.od.length} deals (weighted ${money(sum(r.od,d=>usd(d)*prob(d.stage)/100))})`,
   `${r.q.n}: Commit ${money(r.commit)} · Best case ${money(r.best)} · Won ${money(r.won)}${tgt?` of ${money(tgt)} target`:''}`,''];
  L.push('By stage:');OPEN.forEach(s=>{const ds=r.od.filter(d=>d.stage===s);if(ds.length)L.push(`- ${s}: ${ds.length} · ${money(sum(ds,d=>usd(d)))}`)});
  if(sdrs().length){L.push('','By owner:');['Me',...sdrs()].forEach(n=>{const ds=r.od.filter(d=>n==='Me'?!sdrOf(d):sdrOf(d)===n);if(ds.length)L.push(`- ${n}: ${ds.length} · ${money(sum(ds,d=>usd(d)))}`)})}
  if(r.closing.length){L.push('','Closing this month:');r.closing.forEach(d=>L.push(`- ${d.name} (${d.company}) ${money(usd(d))} · ${d.stage} · ${fmtS(d.closeDate)}`))}
  if(r.moved.length){L.push('','Moved this week:');r.moved.forEach(m=>L.push(`- ${m.d.name}: ${m.from} → ${m.to}`))}
  if(r.issues.length){L.push('','Needs attention:');r.issues.forEach(x=>L.push(`- ${x.d.name}: ${x.p.join(', ')}`))}
  return L.join('\n');
}

function vPlan(){
  const pseg=`<div style="margin-bottom:14px"><div class="seg">${[['plan','Plan'],['weekly','Weekly report']].map(([k,l])=>`<button data-act="plv" data-v="${k}" aria-pressed="${(ui.planView||'plan')===k}">${l}</button>`).join('')}</div></div>`;
  if(ui.planView==='weekly')return `<div class="head"><div><h1>Weekly report</h1><p class="sub">${esc(scopeLabel())} · for your pipeline review with your manager</p></div></div>${pseg}${vWeekly()}`;
  return pseg+vPlanMain();
}
function vPlanMain(){
  const ws=weekStart(), t=today(), acts=S('activities'), tasks=S('tasks');
  const wkTasks=tasks.filter(x=>inWeek(x.date,ws));
  const calls=acts.filter(a=>isCall(a)&&inWeek(a.date,ws)).length, meets=acts.filter(a=>a.outcome==='Meeting booked'&&inWeek(a.date,ws)).length;
  const ct=callTarget(), mt=meetTarget(), dn=wkTasks.filter(x=>x.done).length;
  const contacts=S('contacts').filter(c=>!['Not interested','Customer'].includes(c.status)), deals=openDeals();
  const days=[...Array(7)].map((_,i)=>addDays(ws,i));
  return `<div class="head"><div><h1>Week ${weekNo(ws)} <span style="font-size:.6em;color:var(--muted);font-weight:500">${wkLabel(ws)}</span></h1><p class="sub">${esc(scopeLabel())} · Sunday to Thursday work week</p></div>
   <div class="weeknav"><button class="btn" data-act="wk" data-d="-1" aria-label="Previous week">‹</button><button class="btn" data-act="wk" data-d="0">This week</button><button class="btn" data-act="wk" data-d="1" aria-label="Next week">›</button></div></div>
  <div class="kpis">
   <div class="kpi"><span class="eyebrow">Calls</span><span class="v">${calls}<small> / ${ct}</small></span><div class="bar"><i style="width:${pct(calls,ct)}%"></i></div></div>
   <div class="kpi"><span class="eyebrow">Meetings booked</span><span class="v">${meets}<small> / ${mt}</small></span><div class="bar sig"><i style="width:${pct(meets,mt)}%"></i></div></div>
   <div class="kpi"><span class="eyebrow">Tasks done</span><span class="v">${dn}<small> / ${wkTasks.length}</small></span><div class="bar"><i style="width:${pct(dn,wkTasks.length)}%"></i></div></div>
  </div>
  <div class="days">${days.map(d=>{
    const dow=pd(d).getDay(), we=dow===5||dow===6;
    const tk=wkTasks.filter(x=>x.date===d).sort((a,b)=>(a.done?1:0)-(b.done?1:0));
    const fu=contacts.filter(c=>c.nextFollowUp===d||(d===t&&c.nextFollowUp&&c.nextFollowUp<t));
    const st=deals.filter(x=>x.nextStepDate===d);
    const n=tk.length+fu.length+st.length;
    if(we&&!n)return `<div class="day weekend"><div class="day-h"><b>${pd(d).toLocaleDateString('en-GB',{weekday:'long'})}</b><span class="m">${fmtS(d)} · weekend</span></div><button class="btn ghost" data-act="new" data-coll="tasks" data-date="${d}" style="align-self:flex-start">+ Add task</button></div>`;
    return `<div class="day ${d===t?'today':''} ${we?'weekend':''}"><div class="day-h"><b>${pd(d).toLocaleDateString('en-GB',{weekday:'long'})}</b><span class="m">${fmtS(d)}${d===t?' · today':''}</span></div>

function callQueue(){

/* ---------- accounts ---------- */
const acctKey=n=>norm(n);
const acctId=n=>{let h=0;const k=norm(n);for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return 'a'+h.toString(36)};
function accounts(){
  const m=new Map();
  const add=(name,kind,rec)=>{name=(name||'').trim();if(!name)return;const k=acctKey(name);if(!m.has(k))m.set(k,{name,contacts:[],deals:[],acts:[],tasks:[]});m.get(k)[kind].push(rec)};
  S('contacts').forEach(c=>add(c.company,'contacts',c));S('deals').forEach(d=>add(d.company,'deals',d));S('activities').forEach(a=>add(a.company,'acts',a));S('tasks').forEach(t=>add(t.company,'tasks',t));
  return [...m.values()].map(a=>{a.last=[...a.acts.map(x=>x.date),...a.contacts.map(c=>c.lastContact)].filter(Boolean).sort().pop()||'';a.open=a.deals.filter(d=>OPEN.includes(d.stage));a.sdrs=[...new Set([...a.contacts,...a.deals].map(sdrOf).filter(Boolean))];return a});
}
function accountList(){
  const q=ui.q.trim().toLowerCase();
  const rows=accounts().filter(a=>!q||a.name.toLowerCase().includes(q)).sort((x,y)=>(y.last||'').localeCompare(x.last||'')||x.name.localeCompare(y.name));
  if(!rows.length)return `<div class="empty">${q?'No accounts match.':'<b>No accounts yet.</b> Accounts appear as soon as a contact, deal or call has a company.'}</div>`;
  return `<div class="list">${rows.map(a=>`<div class="row click" data-act="account" data-v="${esc(a.name)}" role="button" tabindex="0"><div class="main"><div class="t">${esc(a.name)}</div><div class="m">${a.contacts.length} ${a.contacts.length===1?'person':'people'} · ${a.open.length} open deal${a.open.length===1?'':'s'}${a.open.length?' · '+money(sum(a.open,usd)):''}${a.last?' · last touch '+fmtS(a.last):''}</div></div>${a.sdrs.map(n=>`<span class="pill own">${esc(n)}</span>`).join('')}</div>`).join('')}</div>`;
}
function vAccount(){
  const back=`<button class="back" data-act="tab" data-tab="contacts">‹ Contacts</button>`;
  const a=accounts().find(x=>acctKey(x.name)===acctKey(ui.account));

function trendSVG(weeks){
  const W=600,H=220,L=40,B=30,T=20,Rr=8;const mx=Math.max(4,...weeks.map(w=>w.calls));const top=Math.ceil(mx/4)*4;const gw=(W-L-Rr)/weeks.length;const y=v=>T+(H-T-B)*(1-v/top);
  let g='';for(let i=0;i<=4;i++){const v=top/4*i;g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+5}" text-anchor="end" font-size="15" fill="var(--muted)">${v}</text>`}
  weeks.forEach((w,i)=>{const x=L+i*gw+gw*.16,bw=gw*.32,cur=i===weeks.length-1;
    g+=`<rect x="${x}" y="${y(w.calls)}" width="${bw}" height="${Math.max(0,H-B-y(w.calls))}" rx="2" fill="var(--accent)" opacity="${cur?1:.75}"><title>${w.calls} calls</title></rect>`;
    g+=`<rect x="${x+bw+3}" y="${y(w.meets)}" width="${bw}" height="${Math.max(0,H-B-y(w.meets))}" rx="2" fill="var(--signal)"><title>${w.meets} meetings booked</title></rect>`;
    if(w.calls)g+=`<text x="${x+bw/2}" y="${y(w.calls)-4}" text-anchor="middle" font-size="15" fill="var(--fg)">${w.calls}</text>`;
    if(w.meets)g+=`<text x="${x+bw*1.5+3}" y="${y(w.meets)-4}" text-anchor="middle" font-size="15" fill="var(--signal)">${w.meets}</text>`;
    g+=`<text x="${L+i*gw+gw/2}" y="${H-6}" text-anchor="middle" font-size="15" fill="var(--muted)" font-weight="${cur?700:400}">${fmtS(w.ws)}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calls and meetings booked per week">${g}</svg>`;
}

function weeklyDataRaw(ws){

  const rev=new Map();const R=co=>{const k=acctKey(co);if(!rev.has(k))rev.set(k,{company:co,acts:[],moves:[],done:[]});return rev.get(k)};
  acts.forEach(a=>a.company&&R(a.company).acts.push(a));
  deals.forEach(d=>(d.stageHistory||[]).forEach((h,i)=>{if(i>0&&rIn(h.at))R(d.company).moves.push(`${d.stageHistory[i-1].stage} → ${h.stage}`)}));
  tasks.filter(t=>t.done&&t.company&&rIn(t.date)).forEach(t=>R(t.company).done.push(t));
  const review=[...rev.values()].map(r=>{const d=dealOf(r.company);const last=[...r.acts].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
    const cnt={};r.acts.forEach(a=>cnt[a.type]=(cnt[a.type]||0)+1);
    const c=cs.find(x=>acctKey(x.company)===acctKey(r.company)&&x.nextFollowUp>=nws);

      action:[...Object.entries(cnt).map(([k,n])=>n>1?`${k} ×${n}`:k),...r.done.map(t=>t.title),...r.moves.map(m=>'Stage '+m)].join(', '),

  tasks.filter(t=>!t.done&&t.company&&inWeek(t.date,nws)).forEach(t=>P(t.company).items.push(`${pd(t.date).toLocaleDateString('en-GB',{weekday:'short'})}: ${t.title}`));
  cs.filter(c=>c.company&&inWeek(c.nextFollowUp,nws)&&!['Not interested','Customer'].includes(c.status)).forEach(c=>{const x=P(c.company);x.contact=x.contact||c.name;const dn=pd(c.nextFollowUp).toLocaleDateString('en-GB',{weekday:'short'});const toks=c.name.split(/[\s.\/]+/).filter(t=>t.length>=3&&!/^(eng|dr)$/i.test(t)).map(norm);if(x.items.some(i=>i.startsWith(dn+':')&&toks.some(t=>norm(i).includes(t))))return;x.items.push(`${pd(c.nextFollowUp).toLocaleDateString('en-GB',{weekday:'short'})}: follow up ${c.name}`);x.contact=x.contact||c.name});
  deals.filter(d=>OPEN.includes(d.stage)&&inWeek(d.nextStepDate,nws)).forEach(d=>P(d.company).items.push(`${pd(d.nextStepDate).toLocaleDateString('en-GB',{weekday:'short'})}: ${d.nextStep||'next step'}`));
  const plan=[...pm.values()].map(x=>{const d=dealOf(x.company);return {company:x.company,deal:d,contact:x.contact||(d&&d.contactName)||'',value:d?usd(d):0,stage:d?d.stage:'Lead',planned:[...new Set(x.items)].join('; '),goal:(d&&d.nextStep)||'',close:d&&d.closeDate||''}})
    .sort((a,b)=>b.value-a.value||stRank(b.stage)-stRank(a.stage));
  const allActs=S('activities');
  return {ws,nws,review,plan,calls:acts.filter(isCall).length,meets:acts.filter(a=>a.outcome==='Meeting booked').length,
    moved:review.reduce((n,r)=>n+(r.action.match(/Stage /g)||[]).length,0),newDeals:deals.filter(d=>inWeek(d.createdAt,ws)).length,
    open:sum(deals.filter(d=>OPEN.includes(d.stage)),usd),openN:deals.filter(d=>OPEN.includes(d.stage)).length,touched:new Set(allActs.filter(a=>rIn(a.date)).map(a=>acctKey(a.company))).size};
}

const FIT=/chief data|\bcdo\b|head of data|data management|data governance|monetiz|data office|\bdmo\b|data strategy|data platform|data & ai|data and ai|analytics|enterprise arch|architect|digital transformation|transformation|digital innovation|\bdx\b|\bpmo\b|\bcio\b|\bcto\b|chief information|chief technology|chief digital/i;
const SENIOR=/chief|head|director|general manager|\bgm\b|\bvp\b|vice president|manager|lead\b|enterprise architect|chief architect|principal architect/i;
function workdayCountries(dow){ // Sun=0 … Sat=6
  if(dow===0)return ['KSA','Egypt','Kuwait','Qatar','Bahrain','Oman'];           // UAE is off on Sunday
  if(dow>=1&&dow<=4)return ['KSA','Egypt','UAE','Kuwait','Qatar','Bahrain','Oman'];
  return [];
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let dailyRan=false;
async function maybeDailyCalls(){
  if(dailyRan||!isOwnerV||VIEWER!=='Me')return;dailyRan=true;
  const target=+(state.settings.dailyCalls??20)||0;const t=today();const dow=pd(t).getDay();
  const countries=workdayCountries(dow);if(!target||!countries.length)return;
  // one run per day across devices
  if(db){
    try{const ref=db.doc('daily/'+t);const l=await ref.acquire({holder:uid(),ttlMs:60000});if(!l.acquired)return;const g=await ref.get();if(g.exists)return;}catch(e){return}
  }else{try{if(localStorage.getItem('salesdesk.daily')===t)return}catch(e){}}
  const open=state.tasks.filter(x=>!x.done&&x.contactId&&x.type==='Call'&&(x.owner||'Me')==='Me'&&!x.extra);
  let rolled=0;
  for(const x of open.filter(x=>x.date&&x.date<t)){await put('tasks',{...x,date:t,carried:(x.carried||0)+1,updatedAt:t});rolled++}
  const have=open.length, need=Math.max(0,target-have);
  const taken=new Set(open.map(x=>x.contactId));
  const pool=state.contacts.filter(c=>c.phone&&(c.status||'New')==='New'&&!sdrOf(c)&&!taken.has(c.id)&&countries.includes(c.country));
  const ranked=l=>[...shuffle(l.filter(c=>FIT.test(c.role||'')&&SENIOR.test(c.role||''))),...shuffle(l.filter(c=>FIT.test(c.role||'')&&!SENIOR.test(c.role||''))),...shuffle(l.filter(c=>!FIT.test(c.role||'')&&SENIOR.test(c.role||'')))];
  const fc=(state.settings.focusCountries||[]).filter(x=>countries.includes(x)), share=Math.min(100,Math.max(0,+(state.settings.focusShare??0)||0))/100;
  let picks;
  if(fc.length&&share>0){const fR=ranked(pool.filter(c=>fc.includes(c.country))),oR=ranked(pool.filter(c=>!fc.includes(c.country)));
    const nF=Math.round(need*share);let a=fR.slice(0,nF),b=oR.slice(0,need-a.length);if(a.length+b.length<need)a=fR.slice(0,need-b.length);picks=shuffle([...a,...b]).slice(0,need);}
  else picks=ranked(pool).slice(0,need);
  let i=0;for(const c of picks){i++;await put('tasks',{id:`auto-${t}-${String(i).padStart(2,'0')}`,title:`Call ${c.name} · ${c.role||c.company}`,date:t,type:'Call',company:c.company,priority:'Normal',owner:'Me',done:false,contactId:c.id,auto:true,createdAt:t,updatedAt:t})}
  const note={date:t,target,carried:rolled,kept:have,added:picks.length,poolLeft:pool.length-picks.length};
  if(db){try{await db.doc('daily/'+t).set(note)}catch(e){}}else{try{localStorage.setItem('salesdesk.daily',t)}catch(e){}}
  if(picks.length||rolled)toast(`Today's calls: ${have} carried over, ${picks.length} new added`);
}

async function saveFile(filename,data,type){
  if(downloads){try{await downloads.save({filename,data});return true}catch(e){if(e&&e.code==='declined')return false}}
  if(!(window.claude&&window.claude.use)){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=filename;document.body.appendChild(a);a.click();a.remove();return true}
  try{await navigator.clipboard.writeText(data);toast('Copied to clipboard');return false}catch(e){return false}

let pendingRestore=null;
async function readRestore(file){
  try{const j=JSON.parse(await file.text());if(!j||j.app!=='sales-desk'||!j.data)throw 0;pendingRestore=j}
  catch(e){toast('That file is not a Sales Excellence backup');return}
  const d=pendingRestore.data, n=COLLS.map(c=>`${(d[c]||[]).length} ${c==='activities'?'calls':c}`).join(' · ');
  $('#restoreBox').innerHTML=`<div class="card" style="margin-top:12px"><b>Backup from ${esc(fmtD((pendingRestore.exportedAt||'').slice(0,10)))}</b><p class="sub" style="margin:4px 0 10px">${esc(n)}</p>
   <div class="toolbar"><button class="btn pri" data-act="restore" data-v="merge">Merge into this device</button>${mode==='cloud'?'':'<button class="btn danger" data-act="restore" data-v="replace">Replace everything here</button>'}</div>
   <p class="sub" style="font-size:12.5px;margin-top:8px">Merge keeps what is here and adds or updates records from the file. Replace makes this device an exact copy of the file.</p></div>`;

async function doRestore(how){
  const d=pendingRestore&&pendingRestore.data;if(!d)return;
  if(how==='replace'&&mode!=='cloud'){COLLS.forEach(c=>state[c]=(d[c]||[]).slice());state.settings={...DEFAULT_SETTINGS,...(d.settings||{})};saveLocal();closeSheet();render();toast('Data replaced from backup');pendingRestore=null;return}
  closeSheet();toast('Restoring…');let n=0;
  for(const c of COLLS)for(const r of (d[c]||[])){if(!r||!r.id)continue;const cur=state[c].find(x=>x.id===r.id);if(cur&&(cur.updatedAt||'')>(r.updatedAt||''))continue;await put(c,{...r});n++}
  if(d.settings&&isOwnerV){state.settings={...DEFAULT_SETTINGS,...state.settings,...d.settings};await saveSettings()}
  pendingRestore=null;toast(`Restored ${n} records`);
}

 cview:b=>{ui.cview=b.dataset.v;ui.q='';render()},
 account:b=>{ui.account=b.dataset.v;ui.tab='account';closeSheet();render();window.scrollTo(0,0)},
 newfor:b=>{const c=b.dataset.coll;openForm(c,{company:b.dataset.c,owner:defOwner(),date:today()},true)},
 acctnotes:b=>openAcctNotes(b.dataset.v),
 ai:b=>{const k=b.dataset.v;if(k==='followup'){openReach(b.dataset.id,'');return}aiOpen(k,k==='followup'?b.dataset.id:k==='prep'?b.dataset.c:null)},
 aichan:b=>{aiChan=b.dataset.v;if(aiLast)aiOpen(aiLast.kind,aiLast.arg)},
 airetry:()=>{if(aiLast)aiOpen(aiLast.kind,aiLast.arg)},
 aicopy:async()=>{const t=$('#aiOut').textContent;try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){const r=document.createRange();r.selectNodeContents($('#aiOut'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Text selected. Copy it from here.')}},
 cadence:b=>openCadence(b.dataset.id),
 stopcad:b=>stopCadence(b.dataset.id),
 dial:(b,e)=>{e&&e.stopPropagation&&e.stopPropagation();startCall(b.dataset.v,b.dataset.id)},
 callagain:b=>openDialer(b.dataset.v,true),
 callai:b=>{const k=b.dataset.v;if(k==='followup'||k==='upsell')aiChan=coachChan;if(k==='voice'){const vl=$('#voiceLang');if(vl)voiceLang=vl.value}const c=state.contacts.find(x=>x.id===b.dataset.id);const spec=k==='company'?PROMPTS.company(b.dataset.id):k==='prep'?(c&&PROMPTS.prep(c.company)):PROMPTS[k](b.dataset.id);const out=$('#callAi'),ft=$('#callAiF');if(!spec||!out)return;out.hidden=false;out.classList.add('wait');
  if(!sampleFn){out.textContent='AI drafting works when this page is open in Claude.';return}
  const run=++aiRunId;const live=()=>run===aiRunId&&out.isConnected;out.textContent=k==='company'?'Pulling together the company brief…':k==='voice'?'Writing your voice note script…':k==='upsell'?'Writing a new upsell message…':k==='prep'?'Preparing the call brief…':k==='pitch'?'Preparing talking points…':'Writing the follow-up…';ft.hidden=true;
  sampleFn(spec.prompt,{cache:false,onText:({text})=>{if(live()&&text){out.textContent=text;out.classList.remove('wait')}}})
   .then(r=>{if(live()){out.textContent=r.text;out.classList.remove('wait');if(c){ft.innerHTML=coachActions(c,k,r.text)}ft.hidden=false}})
   .catch(e=>{if(!live())return;const c=e&&e.code;out.textContent=c==='not_granted'?'AI drafting is turned off for this page.':c==='rate_limited'?'Too many requests. Wait a minute and try again.':'Could not write this right now. Try again.'})},
 coachchan:b=>{coachChan=b.dataset.v;document.querySelectorAll('[data-act=coachchan]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===coachChan))},
 reachacct:b=>openReachAcct(b.dataset.c),
 reach:(b,e)=>{e&&e.stopPropagation&&e.stopPropagation();openReach(b.dataset.id,b.dataset.v)},
 reachlog:b=>{const c=state.contacts.find(x=>x.id===b.dataset.id);if(!c)return;closeSheet();openForm('activities',{company:c.company,contactName:c.name,phone:c.phone,date:today(),type:b.dataset.v==='voice'?'WhatsApp':coachChan,outcome:SENT,notes:b.dataset.v==='voice'?'Voice note sent':'',owner:sdrOf(c)||'Me'},true)},
 callaicopy:async()=>{const t=($('#callAi')||{}).textContent||'';try{await navigator.clipboard.writeText(t);toast('Copied')}catch(_){toast('Select the text to copy')}},
 copy:async b=>{try{await navigator.clipboard.writeText(b.dataset.v);toast('Copied '+b.dataset.v)}catch(e){toast(b.dataset.v)}},
 ident:()=>openIdentity(),
 iam:b=>{VIEWER=b.dataset.v;try{localStorage.setItem('salesdesk.me',VIEWER)}catch(e){}closeSheet();render();toast('Logging as '+VIEWER)},
 import:b=>openImport(b.dataset.v),
 imptab:b=>{imp.tab=b.dataset.v;drawImport()},
 impgo:()=>{if(!imp.busy)runFileImport()},
 appage:b=>apSearch(Math.max(1,imp.ap.page+(+b.dataset.d))),
 apall:()=>{const a=imp.ap;const av=(a.res||[]).filter(x=>!inDesk(x));const all=av.length&&av.every(x=>a.sel.has(x.apolloId));av.forEach(x=>all?a.sel.delete(x.apolloId):a.sel.add(x.apolloId));drawImport()},
 apimport:()=>{if(!imp.busy)apImport()},
 export:b=>exportCSV(b.dataset.coll),
 copyreview:async()=>{const txt=reviewText();try{await navigator.clipboard.writeText(txt);toast('Review summary copied')}catch(e){openSheet(`<div class="panel-h"><h2>Review summary</h2><button class="icon-btn" data-act="close" aria-label="Close">✕</button></div><textarea class="search" style="height:50vh" readonly>${esc(txt)}</textarea>`);$('#panel textarea').select()}},
 cstat:b=>{ui.cstatus=b.dataset.v;render()},
 viewsdr:b=>{ui.csdr=b.dataset.v;ui.cstatus='All';ui.q='';ui.tab='contacts';saveUI();render();window.scrollTo(0,0)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click()}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.toggle){const x=state.tasks.find(k=>k.id===t.dataset.toggle);if(x)put('tasks',{...x,done:t.checked,updatedAt:today()});return}
  if(t.id==='countryPick'){ui.country=t.value;render()}
  if(t.id==='csdrPick'){ui.csdr=t.value;ui.climit=200;render()}
  if(t.id==='clistPick'){ui.clist=t.value;ui.climit=200;render()}
  if(t.id==='qlistPick'){ui.qlist=t.value;render()}
  if(t.dataset.csel){t.checked?ui.sel.add(t.dataset.csel):ui.sel.delete(t.dataset.csel);$('#clist').innerHTML=contactList()}
  if(t.id==='wkrepPick'){ui.wkrep=t.value;render()}
  if(t.id==='outPick'){ui.outcome=t.value;render()}
  if(t.id==='impFile'&&t.files[0])loadImportFile(t.files[0]);
  if(t.id==='restoreFile'&&t.files[0])readRestore(t.files[0]);
  if(t.id==='impColl'){imp.coll=t.value;autoMap();drawImport()}
  if(t.id==='impSheet'){imp.sheet=t.value;autoMap();drawImport()}
  if(t.dataset.map){imp.map[t.dataset.map]=+t.value;drawImport()}
  if(t.id==='impDup')imp.skipDup=t.checked;
  if(t.id==='apSdr')imp.ap.sdr=t.value;
  if(t.dataset.apsel){t.checked?imp.ap.sel.add(t.dataset.apsel):imp.ap.sel.delete(t.dataset.apsel);const b=$('[data-act="apimport"]');if(b){b.disabled=!imp.ap.sel.size;b.textContent=`Import ${imp.ap.sel.size} contact${imp.ap.sel.size===1?'':'s'}`}}
});
document.addEventListener('input',e=>{if(e.target.id==='cq'){ui.q=e.target.value;ui.climit=200;$('#clist').innerHTML=ui.cview==='accounts'?accountList():contactList()}if(e.target.id==='apQ')imp.ap.q=e.target.value});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='recForm')submitRec(f);
  if(f.id==='cadForm')startCadence(f);
  if(f.id==='callForm')submitCall(f);
  if(f.id==='acctForm'){const name=f.dataset.v;const o={id:acctId(name),name,industry:f.elements.industry.value.trim(),website:f.elements.website.value.trim(),notes:f.elements.notes.value,updatedAt:today()};put('accounts',o);closeSheet();toast('Account notes saved')}
  if(f.id==='apForm'){imp.ap.q=$('#apQ').value;imp.ap.sel.clear();apSearch(1)}
  if(f.id==='setForm'){const s=state.settings;s.sdrs=[...new Set(f.elements.sdrs.value.split(/\n|,/).map(x=>x.trim()).filter(x=>x&&x!=='Me'))];['myCalls','myMeetings','sdrCalls','sdrMeetings','quarterTarget','dailyCalls'].forEach(k=>s[k]=f.elements[k].value===''?'':+f.elements[k].value);s.dialerUrl=(f.elements.dialerUrl.value||'').trim();s.focusCountries=(f.elements.focusCountries.value||'').split(',').map(x=>x.trim()).map(x=>COUNTRIES.find(c=>c.toLowerCase()===x.toLowerCase())||(/^saudi/i.test(x)?'KSA':'')).filter(Boolean);s.focusShare=+f.elements.focusShare.value||0;s.dialMode=f.elements.dialMode.value;s.rates={};CURRENCIES.slice(1).forEach(k=>s.rates[k]=+f.elements['rate_'+k].value||DEFAULT_SETTINGS.rates[k]);if(!['All','Me',...s.sdrs].includes(ui.csdr))ui.csdr='All';saveSettings();closeSheet();toast('Settings saved')}
  if(f.id==='qlog'){
    if(!f.elements.company.value.trim()){toast('Add the company to log the call');f.elements.company.focus();return}
    const a={id:uid(),createdAt:new Date().toISOString(),date:today()};['company','contactName','phone','type','outcome','followUp','meetingDate','owner','notes'].forEach(k=>{const el=f.elements[k];a[k]=(el.value||'').trim()});
    put('activities',a);syncContact(a);
    f.reset();$('#q_owner').value=a.owner;$('#q_type').value=a.type;toast(logMsg(a));$('#q_company').focus();
  }
});

/* ---------- boot ---------- */
if(!(window.claude&&window.claude.use))document.documentElement.classList.add('no-claude');
loadLocal();render();
(async()=>{
  const c=window.claude;
  try{db=c&&c.use?await c.use('db'):null}catch(e){db=null}
  try{downloads=c&&c.use?await c.use('downloads'):null}catch(e){downloads=null}
  try{userCap=c&&c.use?await c.use('user'):null}catch(e){userCap=null}
  if(userCap){try{isOwnerV=(await userCap.isOwner())!==false}catch(e){isOwnerV=true}}
  if(!isOwnerV){try{VIEWER=localStorage.getItem('salesdesk.me')||'Me'}catch(e){}}
  if(c&&c.use)c.use('sample').then(f=>{sampleFn=f}).catch(()=>{});
  if(!db){mode='local';render();setTimeout(maybeDailyCalls,300);setTimeout(maybeSaveLastWeek,800);return}
  mode='cloud';
  const loaded=new Set();const ready=k=>{loaded.add(k);if(['contacts','tasks','settings'].every(x=>loaded.has(x)))setTimeout(maybeDailyCalls,500);if(['contacts','tasks','settings','reports','activities','deals'].every(x=>loaded.has(x)))setTimeout(maybeSaveLastWeek,1500)};
  COLLS.forEach(coll=>db.collection(coll).onSnapshot(snap=>{state[coll]=snap.docs.map(d=>({...d.data(),id:d.id}));saveLocal();scheduleRender();if(!snap.metadata.fromCache)ready(coll)},err=>{if(err.code==='revoked'){mode='local';scheduleRender()}}));
  db.doc('settings/main').onSnapshot(s=>{if(!s.metadata.fromCache)ready('settings');if(s.exists){state.settings={...DEFAULT_SETTINGS,...s.data()};state.settings.rates={...DEFAULT_SETTINGS.rates,...(state.settings.rates||{})};saveLocal();scheduleRender()}
    if(!isOwnerV&&!identAsked&&(VIEWER==='Me'||!sdrs().includes(VIEWER))){identAsked=true;VIEWER='Me';openIdentity()}},()=>{});
  render();
})();
</script>

</body></html>
